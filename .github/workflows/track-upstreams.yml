name: Track all FM-1 upstream repositories
on:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * *'
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream HEAD and published browser revisions
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REPO: ${{ github.repository }}
        run: python3 tools/track_upstreams.py
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-upstream-tracking
          path: dist/upstream-tracking.json
