name: Build Felucca browser emulator
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream Felucca
        run: git clone --depth 1 https://github.com/hugelton/Felucca.git upstream/felucca
      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages Pillow fonttools
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.10'
      - name: Build browser engine (not hardware firmware)
        working-directory: upstream/felucca
        run: |
          python3 -c 'from tools.build import generate; generate()'
          sh web/emu/build.sh
          test -s build/emu/felucca.wasm
      - name: Package browser engine and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          REV="$(git -C upstream/felucca rev-parse --short=12 HEAD)"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          python3 tools/create_package.py upstream/felucca/build/emu --id felucca --name Felucca --version "$REV" --output dist/felucca.fm1pkg
          cd dist
          sha256sum felucca.fm1pkg > felucca.fm1pkg.sha256
      - name: Publish immutable browser build release
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ steps.package.outputs.rev }}
        run: |
          set -euo pipefail
          TAG="felucca-web-$REV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Already published $TAG"
          else
            gh release create "$TAG" dist/felucca.fm1pkg dist/felucca.fm1pkg.sha256 --title "Felucca browser $REV" --notes "Browser WebAssembly build of hugelton/Felucca revision $REV; not physical FM-1 firmware."
          fi
